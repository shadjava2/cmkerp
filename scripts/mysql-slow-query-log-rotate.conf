# Configuration logrotate pour le slow query log MySQL
#
# Installation:
#   1. Copier ce fichier dans /etc/logrotate.d/mysql-slow-query-log
#   2. Ajuster le chemin du fichier selon votre installation MySQL
#   3. Vérifier les permissions: chmod 644 /etc/logrotate.d/mysql-slow-query-log
#
# Vérifier le chemin du fichier:
#   mysql> SHOW VARIABLES LIKE 'slow_query_log_file';

/var/lib/mysql/slow-query.log {
    daily
    rotate 7
    compress
    delaycompress
    notifempty
    missingok
    create 0640 mysql mysql
    sharedscripts
    postrotate
        # Optionnel: Flush les logs MySQL après rotation
        # mysqladmin flush-logs 2>/dev/null || true
    endscript
}
