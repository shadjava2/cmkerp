# GraalVM Native Image Configuration
#
# Configuration pour la compilation native avec GraalVM
#
# Bénéfices:
# - Démarrage ultra-rapide (< 100ms)
# - Consommation mémoire réduite (-50%)
# - Pas de JVM (binaire natif)
#
# Limitations:
# - Build time plus long
# - Reflection nécessite configuration
# - Certaines librairies non supportées

# Args pour la compilation native
Args = --no-fallback \
       --install-exit-handlers \
       --enable-all-security-services \
       -H:+AllowDeprecatedBuilderClassesOnImageClasspath \
       -H:+ReportExceptionStackTraces \
       -H:IncludeResources=.*\\.(properties|yml|yaml|json|xml)$ \
       -H:ReflectionConfigurationFiles=META-INF/native-image/reflect-config.json \
       -H:ResourceConfigurationFiles=META-INF/native-image/resource-config.json \
       -H:JNIConfigurationFiles=META-INF/native-image/jni-config.json \
       -H:DynamicProxyConfigurationFiles=META-INF/native-image/proxy-config.json

