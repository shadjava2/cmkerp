# ==========================================
# CONFIGURATION TEST - Base de données MySQL locale
# ==========================================

spring:
  main:
    web-application-type: servlet

  # ==========================================
  # DATASOURCE TEST - MySQL local
  # ==========================================
  datasource:
    url: ${CMK_TEST_DB_URL:jdbc:mysql://localhost:32768/cmkerp-v24dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: ${CMK_TEST_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${CMK_TEST_DB_USER:shad}
    password: ${CMK_TEST_DB_PASSWORD:SDconceptsrdc@243}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000

  # ==========================================
  # HIBERNATE / JPA - Configuration TEST
  # ==========================================
  jpa:
    hibernate:
      ddl-auto: none # Flyway gère le schéma
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        show_sql: false
        cache:
          use_second_level_cache: false # Désactiver le cache en test
          use_query_cache: false
    open-in-view: false

  # ==========================================
  # SLOW QUERY LOG - Désactivé en test
  # ==========================================
  # Note: Le slow query log est désactivé en test pour éviter les logs inutiles
  # cmkerp:
  #   db:
  #     slow-query-log:
  #       enabled: false

  # ==========================================
  # FLYWAY - Migrations DB pour tests
  # ==========================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: 'Baseline du schéma CMK-ERP pour tests'
    validate-on-migrate: true
    clean-disabled: false # Permettre le clean en test si nécessaire

  # ==========================================
  # CACHE - Désactivé en test
  # ==========================================
  cache:
    type: none

  # ==========================================
  # REDIS - Désactivé en test (mock si nécessaire)
  # ==========================================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000

  # ==========================================
  # KAFKA - Désactivé en test
  # ==========================================
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cmkerp-test-group
      auto-offset-reset: earliest

# ==========================================
# CONFIGURATION CMKERP TEST
# ==========================================
cmkerp:
  kafka:
    enabled: false # Désactiver Kafka en test
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 10
  email:
    max-retries: 1 # Réduire les retries en test
    retry-backoff-ms: 100
  security:
    jwt:
      secret: test-secret-key-for-jwt-token-generation-in-tests-only
      expiration-ms: 3600000
      refresh-expiration-ms: 86400000

# ==========================================
# LOGGING TEST - Minimal
# ==========================================
logging:
  level:
    root: WARN
    cd.shad.erp.cmk.cmkerp: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
