# Configuration Spring DevTools pour les projets multi-modules Maven
#
# Ce fichier configure DevTools pour exclure les classes des modules locaux
# du restart classloader. Ces classes seront chargées depuis le classloader
# principal (plus stable), résolvant les problèmes de ClassNotFoundException.
#
# Format: restart.exclude.<nom>=<pattern>
# Les patterns utilisent la syntaxe Ant-style (ex: **/*.class)

# Exclure tous les packages des modules locaux du restart classloader
restart.exclude.sharedkernel=cd/shad/erp/cmk/cmkerp/sharedkernel/**
restart.exclude.platform=cd/shad/erp/cmk/cmkerp/platform/**
restart.exclude.stocks=cd/shad/erp/cmk/cmkerp/stocks/**

