# Configuration d'optimisation pour les rapports PDF
# Ces propriétés peuvent être ajoutées à application.properties ou application.yml

# Compression HTTP Gzip activée pour les réponses > 1KB
server.compression.enabled=true
server.compression.mime-types=application/pdf,application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Optimisations Tomcat (si utilisé)
server.tomcat.max-threads=200
server.tomcat.accept-count=100

# Timeouts optimisés
server.connection-timeout=30000

