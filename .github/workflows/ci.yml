name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: cmkerp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify -DskipTests=false
        env:
          CMK_PRIMARY_DB_URL: jdbc:mysql://localhost:3306/cmkerp_test
          CMK_PRIMARY_DB_USER: root
          CMK_PRIMARY_DB_PASSWORD: rootpassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Build Docker image
        run: docker build -t cmkerp-api:latest .

      - name: Run container tests
        run: |
          docker run -d --name cmkerp-api-test \
            -p 8984:8984 \
            -e SPRING_PROFILES_ACTIVE=test \
            -e CMK_PRIMARY_DB_URL=jdbc:mysql://host.docker.internal:3306/cmkerp_test \
            -e CMK_PRIMARY_DB_USER=root \
            -e CMK_PRIMARY_DB_PASSWORD=rootpassword \
            cmkerp-api:latest
          sleep 30
          curl -f http://localhost:8984/cmkerp-gateway/actuator/health || exit 1
          docker stop cmkerp-api-test
          docker rm cmkerp-api-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/**/*.xml'

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/**/*.xml'
          check_name: 'Unit Test Results'
          comment_mode: 'always'

